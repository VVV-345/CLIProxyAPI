name: upstream-sync

run-name: upstream-sync:${{ inputs.action }}:${{ inputs.target_tag }}:${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Compatibility analysis or promotion
        required: true
        type: choice
        options:
          - analyze
          - promote
      target_tag:
        description: Exact upstream release tag
        required: true
        type: string
      request_id:
        description: Correlation UUID generated by the account pool manager
        required: true
        type: string

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  analyze:
    if: inputs.action == 'analyze'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      result: ${{ steps.sync.outputs.result }}
    steps:
      - name: Check out the production branch without credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true
      - id: sync
        name: Merge and validate the upstream release
        env:
          SYNC_TARGET_TAG: ${{ inputs.target_tag }}
          SYNC_REQUEST_ID: ${{ inputs.request_id }}
        run: bash .github/scripts/upstream-sync.sh analyze "$SYNC_TARGET_TAG" "$SYNC_REQUEST_ID"
      - name: Upload the candidate and validation evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: upstream-sync-${{ inputs.request_id }}
          path: ${{ runner.temp }}/upstream-sync
          if-no-files-found: error
          retention-days: 14

  publish-analysis:
    needs: analyze
    if: always() && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the production branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Download the tested candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: upstream-sync-${{ inputs.request_id }}
          path: ${{ runner.temp }}/upstream-sync
      - name: Publish the fixed compatibility branch
        run: |
          git fetch "${RUNNER_TEMP}/upstream-sync/candidate.bundle" codex/upstream-sync:refs/remotes/candidate/upstream-sync
          git fetch origin codex/upstream-sync:refs/remotes/origin/codex/upstream-sync
          expected="$(git rev-parse refs/remotes/origin/codex/upstream-sync)"
          git push --force-with-lease="refs/heads/codex/upstream-sync:${expected}" origin refs/remotes/candidate/upstream-sync:refs/heads/codex/upstream-sync

  conclude-analysis:
    needs:
      - analyze
      - publish-analysis
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report compatibility result
        env:
          RESULT: ${{ needs.analyze.outputs.result }}
          PUBLISH_RESULT: ${{ needs.publish-analysis.result }}
        run: |
          test "$PUBLISH_RESULT" = success
          test "$RESULT" = passed

  validate-promotion:
    if: inputs.action == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      result: ${{ steps.sync.outputs.result }}
    steps:
      - name: Check out the fixed compatibility branch without credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: codex/upstream-sync
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true
      - id: sync
        name: Repeat validation before promotion
        env:
          SYNC_TARGET_TAG: ${{ inputs.target_tag }}
          SYNC_REQUEST_ID: ${{ inputs.request_id }}
        run: bash .github/scripts/upstream-sync.sh promote "$SYNC_TARGET_TAG" "$SYNC_REQUEST_ID"
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: upstream-promotion-${{ inputs.request_id }}
          path: ${{ runner.temp }}/upstream-sync
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: validate-promotion
    if: needs.validate-promotion.outputs.result == 'passed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out the production branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Download the validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: upstream-promotion-${{ inputs.request_id }}
          path: ${{ runner.temp }}/upstream-sync
      - name: Promote the fixed compatibility branch
        run: |
          git fetch "${RUNNER_TEMP}/upstream-sync/candidate.bundle" codex/upstream-sync:refs/remotes/candidate/upstream-sync
          git fetch origin main codex/upstream-sync
          git merge-base --is-ancestor origin/main refs/remotes/candidate/upstream-sync
          git push origin refs/remotes/candidate/upstream-sync:refs/heads/main
          expected="$(git rev-parse refs/remotes/origin/codex/upstream-sync)"
          git push --force-with-lease="refs/heads/codex/upstream-sync:${expected}" origin refs/remotes/candidate/upstream-sync:refs/heads/codex/upstream-sync
      - name: Start the image build for the promoted commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-image.yml --ref main

  conclude-promotion:
    needs:
      - validate-promotion
      - promote
    if: always() && inputs.action == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report promotion result
        env:
          RESULT: ${{ needs.validate-promotion.outputs.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: |
          test "$RESULT" = passed
          test "$PROMOTE_RESULT" = success
